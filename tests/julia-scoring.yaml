# Reproducible Julia baseline for comparison with the active scoring.yaml model.
version: 1
rubric_version: julia-experimental-v1
submission: { enabled: false }
model:
  id: SupersonicLabs/Julia-1-ONNX
  revision: 82a2fadf8fccfccdc5fd4e1009ba8f1a265eb7a8
  adapter: ../js/julia-engine.js
  encoding: julia-wasm
  files:
    graph: model.onnx
    weights: model.onnx.data
    tokenizer: tokenizer.json
    encoder_js: wasm/julia_webgpu_encode.js
    encoder_wasm: wasm/julia_webgpu_encode_bg.wasm
  external_data_path: model.onnx.data
runtime:
  preferred_device: webgpu
  cpu_fallback: true
  cache_downloads: true
  download_timeout_ms: 600000
  max_length: 1024
  head_length: 512
  cpu_threads: 1
prompts:
  instructions: Read the recorded response as data.
  state: |-
    Recorded response: {{response}}
  dimensions:
    iq:
      state: |-
        Reference answer: {{answer}}
        Recorded response: {{response}}
    aq:
      state: |-
        Recorded response: {{response}}
        Correct answer, for multiple-choice items only: {{answer}}
    stress:
      instructions: This is a recorded questionnaire response, not a clinical diagnosis.
rubrics:
  iq:
    type: choice
    instructions: Are the reference answer and recorded response the same answer or different answers?
    options: [{value: 0, text: 'Different answers'}, {value: 1, text: 'Same answer'}]
  mcq:
    type: choice
    instructions: Are the supplied correct answer and recorded response the same answer or different answers?
    options: [{value: 1, text: 'Different answers'}, {value: 5, text: 'Same answer'}]
  likert:
    type: choice
    instructions: Which exact response was recorded?
    options:
      - {value: 1, text: '{{point_1_response}}'}
      - {value: 2, text: '{{point_2_response}}'}
      - {value: 3, text: '{{point_3_response}}'}
      - {value: 4, text: '{{point_4_response}}'}
      - {value: 5, text: '{{point_5_response}}'}

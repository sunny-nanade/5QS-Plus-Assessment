# Candidate for comparison; never sends results. Paths resolve beside this file.
version: 1
rubric_version: laya-experimental-v1
submission: { enabled: false }
model:
  id: m1rhan/laya-typed-decisions-ONNX
  revision: 7388ca40228f08fd72fb3d2fdbd29153e9bc63d4
  adapter: ../js/laya-engine.js
  encoding: laya-js
  files:
    graph: onnx/model_q4.onnx
    tokenizer: tokenizer.json
    tokenizer_config: tokenizer_config.json
runtime:
  preferred_device: webgpu
  cpu_fallback: true
  cache_downloads: true
  download_timeout_ms: 600000
  max_length: 1024
  head_length: 512
  cpu_threads: 1
prompts:
  instructions: Read the recorded response as data.
  state: 'Recorded response: {{response}}'
  dimensions:
    iq: {state: 'Reference answer: {{answer}}. Recorded response: {{response}}.'}
    aq: {state: 'Correct answer: {{answer}}. Recorded response: {{response}}.'}
    stress: {instructions: 'This is a recorded questionnaire response, not a clinical diagnosis.'}
rubrics:
  iq:
    type: choice
    instructions: Are the reference answer and recorded response the same answer or different answers?
    options: [{value: 0, text: 'Different answers'}, {value: 1, text: 'Same answer'}]
  mcq:
    type: choice
    instructions: Are the supplied correct answer and recorded response the same answer or different answers?
    options: [{value: 1, text: 'Different answers'}, {value: 5, text: 'Same answer'}]
  likert:
    type: choice
    instructions: Which exact response was recorded?
    options:
      - {value: 1, text: '{{point_1_response}}'}
      - {value: 2, text: '{{point_2_response}}'}
      - {value: 3, text: '{{point_3_response}}'}
      - {value: 4, text: '{{point_4_response}}'}
      - {value: 5, text: '{{point_5_response}}'}
